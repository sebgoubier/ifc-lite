name: Issue 6729 downloadable comparison model
on:
  push:
    branches: [t3/6729-vercel-model]
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Reuse the existing IFC test writer and package a static download
        run: |
          node .github/scripts/6729-model.mjs "$PWD" "$PWD/.vercel/output/static"
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync('.vercel/output/config.json', JSON.stringify({version:3,routes:[{src:'/orthographic-4mm.ifc',headers:{'Content-Type':'application/octet-stream','Content-Disposition':'attachment; filename="orthographic-4mm.ifc"'},continue:true},{handle:'filesystem'}]}));
          fs.writeFileSync('.vercel/output/static/index.html', '<!doctype html><meta name="viewport" content="width=device-width"><title>6729 test model</title><h1>Orthographic comparison model</h1><p><a href="orthographic-4mm.ifc" download>Download orthographic-4mm.ifc</a></p><p>Three products: a blue foreground plate, a red rear plate with 4mm clearance, and a grey extent slab. Keep all three visible. Choose Orthographic and the Front view, then orbit around the front face. The central face should stay blue; a red rim is intentional. Perspective is the control.</p>');
          JS
      - name: Publish only the static model download as a preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TELEMETRY_DISABLED: '1'
        run: |
          test -n "$VERCEL_TOKEN"
          pnpm dlx vercel@64.5.0 link --yes --project ifc-lite --scope ltplus --token "$VERCEL_TOKEN"
          pnpm dlx vercel@64.5.0 deploy --yes --target=preview --prebuilt --archive=tgz --scope ltplus --token "$VERCEL_TOKEN" --meta comparison=6729 --meta comparisonVersion=model > model-url.txt
          cat model-url.txt
          cat model-url.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-url
          path: model-url.txt
          if-no-files-found: error
